server {
    # 8080, not 3000: nginxinc/nginx-unprivileged runs as uid 101 and cannot bind
    # a privileged port. 8080 is what that base image already expects, so nothing
    # here needs root in order to listen.
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Without this, nginx's directory redirect (/foo -> /foo/) emits an ABSOLUTE
    # Location built from the container's own name and port:
    #
    #   Location: http://learnforge-web:8080/foo/
    #
    # which leaks the internal origin straight through the reverse proxy.
    #
    # To test it, read the RAW header: `curl -sD - -o /dev/null <url>`.
    # `curl -w '%{redirect_url}'` RESOLVES a relative Location against the request
    # URL, so it prints a correct and a broken configuration identically.
    absolute_redirect off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Health sentinel. THE ORDER MATTERS: this has to be an exact-match location,
    # because the SPA fallback below answers EVERY path with index.html and a 200
    # -- /health included. A check that only inspects the status code would pass
    # against the SPA shell, and would pass identically against a garbage path.
    #
    # The body names this app on purpose. Once several migrated containers share
    # the host, a port collision with a SIBLING container false-passes a generic
    # "ok" -- which is the exact failure this sentinel exists to catch.
    location = /health {
        access_log off;
        default_type application/json;
        return 200 "{\"status\":\"ok\",\"service\":\"learnforge-web\"}\n";
    }

    # Cache static assets aggressively (hashed filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Try: exact file -> prerendered directory index -> SPA fallback.
    #
    # Deliberately NO bare-.html fallback ($uri.html): web-ui/prerender.mjs writes
    # every prerendered route as <route>/index.html, never as <route>.html, so
    # extensionless URLs already resolve through $uri/index.html. Checked against
    # prerender.mjs rather than assumed in either direction.
    location / {
        try_files $uri $uri/index.html /index.html;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
}
