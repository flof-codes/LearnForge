<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
    <title>LearnForge</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        /* ER brand dark-theme surface (#232323) + Neutral-200 text (#E5E5E5). */
        background: #232323;
        color: #E5E5E5;
        font: 16px/1.45 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        /* Kill WebView zoom + iOS auto-sizing + rubber-band scroll. */
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
        overscroll-behavior: none;
      }
      #app { min-height: 100%; padding: 20px 16px 32px; box-sizing: border-box; }
      .companion h1 { font-size: 18px; margin: 0 0 4px; font-weight: 600; }
      .companion .status { margin: 0 0 16px; color: #9a9a9a; font-size: 14px; }
      .companion .question { background: #2f2f2f; border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
      .companion .question p { margin: 0 0 8px; }
      .companion .question ul { margin: 0; padding-left: 0; list-style: none; color: #cfcfcf; font-size: 15px; }
      .companion .question li { padding: 2px 0; }
      .companion form { display: flex; flex-direction: column; gap: 8px; }
      .companion textarea { width: 100%; box-sizing: border-box; background: #1b1b1b; color: #E5E5E5; border: 1px solid #444; border-radius: 10px; padding: 10px 12px; font: inherit; resize: none; }
      .companion button { background: #8CF59A; color: #0b1a0d; border: 0; border-radius: 10px; padding: 12px; font: inherit; font-weight: 600; }
      .companion button:disabled { opacity: .5; }
      .companion .answer { margin-top: 14px; background: #1b2b1e; border: 1px solid #3f6a46; border-radius: 10px; padding: 12px 14px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <div id="app">LearnForge is starting. Check the glasses display.</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
