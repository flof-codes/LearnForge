services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: learnforge
      POSTGRES_PASSWORD: "${DB_PASSWORD:-learnforge}"
      POSTGRES_DB: learnforge
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnforge"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "3008:3000"
      - "3009:3001"
    environment:
      DATABASE_URL: "postgresql://learnforge:${DB_PASSWORD:-learnforge}@db:5432/learnforge"
      PORT: "3000"
      IMAGE_PATH: /data/images
      JWT_SECRET: "${JWT_SECRET}"
      JWT_EXPIRES_IN: "7d"
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"
      STRIPE_PRICE_ID_MONTHLY: "${STRIPE_PRICE_ID_MONTHLY:-}"
      STRIPE_PRICE_ID_ANNUAL: "${STRIPE_PRICE_ID_ANNUAL:-}"
      APP_URL: "${APP_URL:-http://localhost:5173}"
      MCP_PORT: "3001"
      MCP_PUBLIC_URL: "${MCP_PUBLIC_URL}"
    volumes:
      - ./data/images:/data/images
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web-ui/Dockerfile
    # TRANSITIONAL, and required in the same commit as the Dockerfile change.
    #
    # These six moved from build ARGS to RUNTIME environment. web-ui/Dockerfile no
    # longer declares them as ARGs, so leaving them under `args:` would silently do
    # nothing and the container would refuse to start with "unset required
    # variable(s)". Because this file is what the legacy deploy job builds and runs
    # on the server, that would have taken the live site down on the next push.
    #
    # No defaults for the three that carry legal weight: an Impressum that falls
    # back to "LearnForge, Austria" is wrong in a way that looks fine. The
    # entrypoint fails closed on an empty value, so a missing one is a failed
    # health check rather than a published defect.
    environment:
      VITE_API_URL: "${VITE_API_URL}"
      VITE_DONATION_URL: "${VITE_DONATION_URL:-}"
      OPERATOR_NAME: "${OPERATOR_NAME}"
      OPERATOR_ADDRESS: "${OPERATOR_ADDRESS:-}"
      OPERATOR_CITY: "${OPERATOR_CITY}"
      OPERATOR_EMAIL: "${OPERATOR_EMAIL}"
    ports:
      # 8080, not 3000: the image now uses nginx-unprivileged, which runs as uid
      # 101 and cannot bind a privileged port. The published port is unchanged, so
      # the Apache vhost in front of it needs no edit.
      - "8090:8080"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pg_data:
    name: learnforge_pg_data
