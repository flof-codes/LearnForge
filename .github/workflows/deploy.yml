# Build & Deploy -- registry deploys. Flipped 2026-08-26; phase 1a is over here.
#
#   build -> test -> build-images (GHCR) -> deploy
#
# THE DEPLOY JOB SENDS NO COMMAND. `ssh ... true` is a placeholder: the key's
# authorized_keys entry carries a forced command, so sshd DISCARDS whatever is
# sent from here and runs `sudo /usr/local/sbin/deploy-service.sh learnforge`.
# That script snapshots the service dataset, pulls both images and restarts the
# stack from ONE service directory -- which is why a single deploy job covers two
# images, and why nothing in this file names a compose file.
#
# WHY INLINE, not `uses: flof-codes/.github/.../deploy-trigger.yml@main`:
# that repo is PRIVATE and this one is PUBLIC. GitHub does not permit a public
# repo to consume a reusable workflow from a private one, and the failure mode is
# a run marked completed with ZERO jobs, no logs and no annotations. Same reason
# build-images inlines build-push.yml. THE OBLIGATION THIS CREATES: a fix to
# either shared workflow DOES NOT REACH THIS FILE. Nothing warns.
#
# WHAT THIS REPLACED, and why it was green for three weeks while doing nothing:
# the legacy job ran `cd /opt/learnforge && sudo ./scripts/backup.sh && git pull
# && docker compose -f docker-compose.prod.yml up --build -d`. Phase 1a retired
# learnforge on 2026-07-31 -- checkout deleted, sudoers rule for
# scripts/backup.sh removed. The SAME DAY the shared `github-deploy` key, which
# is still this repo's DEPLOY_SSH_KEY, was given a forced command naming
# `deploy-service.sh wobble`. Every push here has deployed WOBBLE since and
# reported success; the runs on 08-04 and 08-26 both did. Nothing was ever red.
#
# The lesson worth carrying: a job that SENDS a command to a forced-command key
# cannot fail loudly, because the command it sends is never read. Correctness
# lives in WHICH KEY the secret holds, not in anything written here.
#
# NO PRE-DEPLOY DUMP, deliberately. deploy-service.sh takes a ZFS snapshot of the
# whole service dataset before every deploy and refuses to deploy if that
# snapshot fails (1c section 8), honours PREDEPLOY_KEEP, and logs "dump skipped
# -- the pre-deploy snapshot above already covers the whole directory".
# scripts/backup.sh stays in the repo as a LOCAL dev dump against
# docker-compose.yml. It is not a deploy step, and its sudoers rule is gone.
#
# HOST, PORT AND USER STAY IN SECRETS -- this repo is public. The flip checklist
# said to delete DEPLOY_PORT and DEPLOY_USER because the SHARED workflow takes
# them as inputs with defaults. Inlining reverses that: written literally here
# they would publish the port and the deploy account name, so they stay secrets.
# DEPLOY_KNOWN_HOSTS pins the host key. Never ssh-keyscan at deploy time -- that
# trusts the answer it is trying to verify.
#
# STILL OPEN from the flip checklist:
#   [ ] delete docker-compose.prod.yml -- record its contents in the handoff
#       report FIRST, the rollback path needs them. Confirm server-config's
#       backup/backup-targets.conf no longer names the /opt path before removing
#       it: a stale path there aborts the WHOLE nightly database run, not just
#       this app's dump.
#   [ ] delete, or rename to compose.dev.yml, the non-live docker-compose.yml.
#       NOT cosmetic: on the server that file is writable by the deploy user and
#       sits beside a sudoers rule, which together form a root-escalation path.
#       Touches README.md, CLAUDE.md and the test harness.
#   [ ] have the deploy gate assert /runtime-info.json's apiUrl equals the expected
#       production URL. The container healthcheck CANNOT -- only the gate knows the
#       right value, and a wrong-but-present apiUrl passes every other check we have.
#   [ ] chown the /data/images bind mount, then add `USER node` to api/Dockerfile
#   [ ] update README.md and CLAUDE.md: /opt/learnforge and "server builds from
#       source" both stop being true
#
# PUSH TO MAIN NOW DEPLOYS PRODUCTION IMMEDIATELY, and whatever pre-commit gate
# this repo has just became the release gate.
# ---------------------------------------------------------------------------

name: Build & Deploy

on:
  push:
    # phase1a/** so the image builds can be verified before merge. Actions cache
    # is ref-scoped, so a branch build and a main build share nothing and the main
    # build is a full rebuild -- which means what was verified on the branch is NOT
    # what :latest ends up pointing at (DRIFT #45). Both need gating, per image.
    #
    # build-push.yml withholds :latest from non-default branches, so a branch push
    # publishes only an immutable :<sha> tag. The deploy job below is
    # additionally guarded on main.
    branches: [main, 'phase1a/**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # ── Install backend dependencies (lockfile-driven) ──
      - name: Install dependencies (core, api, mcp)
        run: npm ci -w core -w api -w mcp

      # ── Build & type check backend (tsc -b resolves project references) ──
      - name: Build & check (API → core + MCP)
        run: npx tsc -b --force
        working-directory: api

      - name: TypeScript check (MCP)
        run: npx tsc --noEmit
        working-directory: mcp

      # ── Lint checks (backend) ──
      - name: Lint (Core)
        run: npx eslint .
        working-directory: core

      - name: Lint (API)
        run: npx eslint .
        working-directory: api

      - name: Lint (MCP)
        run: npx eslint .
        working-directory: mcp

      # ── Install web-ui dependencies (npm install: root lockfile has macOS-only rollup binaries) ──
      - name: Install dependencies (web-ui)
        run: npm install -w web-ui --no-package-lock --no-audit --no-fund

      # ── Web UI build & lint ──
      - name: TypeScript & build check (Web UI)
        run: npm run build
        working-directory: web-ui

      - name: Lint (Web UI)
        run: npx eslint .
        working-directory: web-ui

  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # ── Create .env.test for test-api container (Stripe test keys) ──
      - name: Create test env file
        run: |
          cat > tests/.env.test << 'EOF'
          STRIPE_SECRET_KEY=
          STRIPE_PRICE_ID_MONTHLY=
          STRIPE_PRICE_ID_ANNUAL=
          STRIPE_WEBHOOK_SECRET=whsec_test_learnforge_integration_tests
          EOF

      # ── Install test runner dependencies ──
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
        working-directory: tests

      # ── Run integration tests (vitest handles docker compose up/down) ──
      - name: Run integration tests
        run: npx vitest run --config vitest.config.ts
        working-directory: tests

      # ── Ensure containers are torn down even on failure ──
      - name: Cleanup test containers
        if: always()
        run: docker compose -f docker-compose.test.yml down --volumes --remove-orphans 2>/dev/null || true
        working-directory: tests

  # ---------------------------------------------------------------------------
  # Publish to GHCR. The deploy job at the bottom consumes these images.
  #
  # THIS IS A COPY OF flof-codes/.github's build-push.yml, REDUCED, AND THAT IS
  # A DELIBERATE EXCEPTION.
  #
  # Every other app calls the shared reusable workflow. LearnForge cannot:
  # GitHub does not permit a PUBLIC repository to consume a reusable workflow
  # from a PRIVATE one, and flof-codes/.github is private and staying private.
  # No setting bridges it -- the "Accessible from repositories owned by the
  # user" policy only widens sharing among private repos. The failure mode, if
  # anyone tries again, is a run marked completed with ZERO jobs, no logs and no
  # annotations, which reads as a malformed workflow file rather than as a
  # visibility problem. Two runs on 2026-07-30 confirmed it, including an
  # 8-line minimal caller with permissions declared.
  #
  # THE OBLIGATION THIS CREATES: a fix to build-push.yml -- a pinned action SHA,
  # the concurrency key, the provenance decision -- DOES NOT REACH THIS FILE.
  # Nothing warns and nothing fails; it keeps building with the old logic.
  # server-config's README records the same obligation from the other side.
  #
  # TWO images, not three. api/src/index.ts starts Fastify AND the MCP
  # StreamableHTTP server in one process, and no mcp/Dockerfile exists, so there
  # is no third image to build.
  #
  # STILL GATED ON `needs: [build, test]`, which is why this lives here rather
  # than in its own workflow file: a separate file cannot depend on jobs in this
  # one, so it would publish images from a run whose tests had failed. That
  # property survived the flip -- deploy now hangs off build-images, so the same
  # gate transitively covers the deploy.
  #
  # No build-args. The web image's six configuration values are placeholder
  # tokens substituted at container start by web-ui/docker-entrypoint.sh, which
  # keeps one artifact usable in every environment and keeps the operator's
  # postal address out of both the repo and the image history.
  #
  # NO HOST, PORT OR USERNAME APPEARS IN THIS JOB, deliberately -- this repo is
  # public. The build half needs none; the deploy job reads DEPLOY_HOST,
  # DEPLOY_PORT, DEPLOY_USER and DEPLOY_KNOWN_HOSTS from secrets, which are not
  # publicly readable.
  # ---------------------------------------------------------------------------
  build-images:
    needs: [build, test]
    runs-on: ubuntu-24.04

    # ONE JOB DEFINITION FOR BOTH IMAGES. Two near-identical jobs in one file is
    # the same drift this whole design exists to prevent, one scope smaller.
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: learnforge-api
            dockerfile: api/Dockerfile
          - image: learnforge-web
            dockerfile: web-ui/Dockerfile

    # ONE BUILD PER REF PER IMAGE, and this MUST be job-level, for two
    # independent reasons.
    #
    # The `matrix` context does not exist at workflow level -- it is available
    # in jobs.<job_id>.concurrency only. Written at the top of the file,
    # ${{ matrix.image }} expands to the empty string, both images land in one
    # group, and with cancel-in-progress each cancels the other: the run ends
    # with one image at the new commit and one still at the old. No parse error,
    # no warning.
    #
    # And workflow-level concurrency would cover EVERY job including the deploy
    # job added at the flip, which must never be cancellable. That was DRIFT #38
    # in the shared workflow; do not re-introduce it here.
    concurrency:
      group: build-images-${{ github.ref }}-${{ matrix.image }}
      cancel-in-progress: true

    # The default GITHUB_TOKEN is read-only on contents and has NO package
    # scope. Both are named explicitly rather than inherited, so this is
    # reviewable here instead of in a repository setting nobody looks at.
    permissions:
      contents: read
      packages: write

    steps:
      # Third-party actions are pinned BY COMMIT SHA, never by tag. A tag is
      # mutable, and a moved tag runs unreviewed code in a job holding
      # packages:write. The trailing comment is the readable version.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      # :latest MOVES ONLY ON THE DEFAULT BRANCH -- that is what `enable` does,
      # and it is a safety property rather than tidiness. The host pulls :latest.
      # Without it, pushing a feature branch would silently make that branch what
      # production deploys next. Every build still gets an immutable :<full-sha>,
      # so a branch build is deployable on purpose -- by naming its SHA -- but
      # never by accident.
      #
      # The image names are lowercase literals in the matrix above. build-push.yml
      # lowercases defensively because it derives the name from the repository,
      # and `LearnForge` would otherwise reach the registry with capitals, which
      # it rejects. Here they are written out, so there is nothing to lowercase.

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          # Context is the REPO ROOT for both images: api/Dockerfile copies
          # core/, mcp/ and api/, and web-ui/Dockerfile copies the root
          # package.json alongside web-ui/. Neither builds from its own
          # subdirectory.
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # provenance/sbom off DELIBERATELY. With them on, buildx pushes an
          # image INDEX (the image plus attestation manifests) rather than a
          # plain manifest. Everything still runs, but the phase 1a digest
          # comparison then measures an index digest against a manifest digest
          # and reports a mismatch that is not one. Revisit once digest
          # comparison is settled; note it in DRIFT.md if it is turned on.
          provenance: false
          sbom: false

      - name: Report
        # A LOCALLY built digest is not the same artifact -- CI will not
        # reproduce it, because metadata-action stamps the commit into the config
        # and the created timestamp moves on every rebuild. Only "same run" is a
        # valid basis for comparison, so the run page carries both.
        run: |
          set -euo pipefail
          {
            echo "## ${{ matrix.image }}"
            echo
            echo '```'
            echo "image:  ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}"
            echo "digest: ${{ steps.build.outputs.digest }}"
            echo "run:    ${{ github.run_id }}"
            echo "commit: ${{ github.sha }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # ONE deploy job, NEVER one per image: two would race parallel `compose
  # pull/up` into a single service directory. Gated on build-images rather than
  # on [build, test] so it cannot fire before both images are in the registry --
  # build-images is itself gated on [build, test], so the test gate still covers
  # the deploy.
  #
  # Guarded on main because the trigger above also matches phase1a/** branches,
  # and because :latest -- which the host pulls -- only moves on the default
  # branch. Without the guard a branch push would deploy that branch.
  # ---------------------------------------------------------------------------
  deploy:
    needs: [build-images]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04

    # NEVER cancel a deploy -- that was DRIFT #38. Cancelling mid-run would abort
    # a half-finished `compose up` on the host and leave the stack part-restarted.
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false

    permissions:
      contents: read

    steps:
      # No third-party action: the key is written directly, which is what the
      # shared deploy-trigger does. One less action to pin by SHA, and nothing
      # holds the private half beyond this job.
      - name: Trigger deploy
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          # An unset secret expands to empty, and ssh would then fail with
          # something unhelpful three steps later. Name the missing one instead.
          # DEPLOY_KNOWN_HOSTS is the one that does not exist yet: this job stays
          # RED until it is set, which is the point -- a silent green deploy is
          # exactly what this replaced.
          for v in KEY KNOWN_HOSTS HOST USER PORT; do
            if [ -z "${!v}" ]; then
              echo "::error::deploy: secret $v is not set" >&2
              exit 1
            fi
          done
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY"         > ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # `true` is DISCARDED -- see the forced-command note at the top of this
          # file. What actually runs is deploy-service.sh learnforge.
          ssh -i ~/.ssh/id_deploy \
              -o IdentitiesOnly=yes \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o StrictHostKeyChecking=yes \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              -p "$PORT" "$USER@$HOST" true

      - name: Remove the key from the runner
        if: always()
        run: rm -f ~/.ssh/id_deploy ~/.ssh/known_hosts
