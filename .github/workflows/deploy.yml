# Build & Deploy -- MID-MIGRATION STATE, phase 1a.
#
# Two deploy paths coexist here on purpose, and only ONE of them is live:
#
#   LEGACY (live)   build -> test -> deploy: ssh to the host, git pull, and
#                   `docker compose -f docker-compose.prod.yml up --build`. The
#                   server builds from source. This is what updates the site today.
#
#   NEW (dormant)   build-api-image / build-web-image publish to GHCR with
#                   `deploy: false`. The images are pullable and verifiable by
#                   hand; nothing on the server consumes them yet.
#
# Keeping the legacy job alive is the ZERO-FREEZE pattern: deleting it is what
# stops pushes from updating the live site, regardless of whether the new path
# works. Both paths build from the same commit, which is also what makes the
# container-versus-live URL parity comparison exact.
#
# BECAUSE THE LEGACY PATH BUILDS FROM SOURCE, EVERY PUSH TO MAIN DEPLOYS THE
# CURRENT DOCKERFILE. A port change or a `USER` change lands on the live site the
# moment it lands on main, unless the same commit carries matching transitional
# edits to docker-compose.prod.yml. The api image deliberately still runs as root
# for exactly this reason -- see the comment in api/Dockerfile.
#
# ---------------------------------------------------------------------------
# THE FLIP COMMIT -- a checklist, not an ad-hoc assembly. In ONE commit:
#
#   [ ] ADD a `deploy` job here -- inline, NOT `uses: deploy-trigger.yml@main`.
#       The shared deploy-trigger workflow is unreachable for the same reason
#       build-push.yml is: it lives in the PRIVATE flof-codes/.github, and this
#       repo is PUBLIC. Reaching for it at flip time produces the same zero-job
#       startup_failure, at the worst possible moment. Inline it:
#
#         deploy:
#           needs: [build-images]          # <- ONE job now, covering both images
#           if: github.ref == 'refs/heads/main'
#           runs-on: ubuntu-24.04
#           concurrency:
#             group: deploy-${{ github.ref }}
#             cancel-in-progress: false     # <- NEVER cancel a deploy (DRIFT #38)
#           steps:
#             - uses: webfactory/ssh-agent@<PIN BY SHA>
#               with: { ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }} }
#             - run: echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
#             - run: ssh -p ${{ secrets.DEPLOY_PORT }} \
#                      ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} true
#
#       The remote command is IGNORED -- sshd substitutes the forced command in
#       authorized_keys, which runs `sudo /usr/local/sbin/deploy-service.sh
#       learnforge`. That script pulls and restarts BOTH images from one service
#       directory, which is why one deploy job covers two images and why nothing
#       here names a compose file.
#
#       DEPLOY_KNOWN_HOSTS must be SET FIRST -- it is currently unset, and it is
#       what stops this trusting whatever host answers. Do not fall back to
#       ssh-keyscan at deploy time; that trusts the answer it is trying to verify.
#
#       One deploy job, never one per image: two would fire parallel
#       `compose pull/up` races into one service directory.
#   [ ] delete the legacy `deploy` job below
#   [ ] delete docker-compose.prod.yml -- but record its contents in the handoff
#       report FIRST, because the rollback path needs them
#   [ ] delete, or rename to compose.dev.yml, the non-live docker-compose.yml.
#       NOT cosmetic: on the server that file is writable by the deploy user and
#       sits beside a sudoers rule, which together form a root-escalation path.
#       Touches README.md, CLAUDE.md and the test harness.
#   [ ] delete the now-dead DEPLOY_PORT and DEPLOY_USER secrets -- the shared
#       workflow takes those as inputs. They are still in use by the legacy job
#       until this commit, which is why they survive for now.
#       The secrets here are DEPLOY_*, NOT SSH_*: this repo has DEPLOY_HOST,
#       DEPLOY_PORT, DEPLOY_USER and DEPLOY_SSH_KEY. There is no SSH_* set to
#       delete, and DEPLOY_KNOWN_HOSTS does not exist yet and must be added.
#   [ ] rotate DEPLOY_SSH_KEY to the forced-command keypair (server-side change,
#       coordinated -- the old key's public half is still in authorized_keys
#       without a forced command)
#   [ ] update README.md and CLAUDE.md: /opt/learnforge and "server builds from
#       source" both stop being true
#   [ ] have the deploy gate assert /runtime-info.json's apiUrl equals the expected
#       production URL. The container healthcheck CANNOT -- only the gate knows the
#       right value, and a wrong-but-present apiUrl passes every other check we have.
#   [ ] chown the /data/images bind mount, then add `USER node` to api/Dockerfile
#
# From the flip commit onward, PUSH TO MAIN DEPLOYS PRODUCTION IMMEDIATELY, and
# whatever pre-commit gate this repo has just became the release gate.
# ---------------------------------------------------------------------------

name: Build & Deploy

on:
  push:
    # phase1a/** so the image builds can be verified before merge. Actions cache
    # is ref-scoped, so a branch build and a main build share nothing and the main
    # build is a full rebuild -- which means what was verified on the branch is NOT
    # what :latest ends up pointing at (DRIFT #45). Both need gating, per image.
    #
    # build-push.yml withholds :latest from non-default branches, so a branch push
    # publishes only an immutable :<sha> tag. The legacy deploy job below is
    # additionally guarded on main.
    branches: [main, 'phase1a/**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # ── Install backend dependencies (lockfile-driven) ──
      - name: Install dependencies (core, api, mcp)
        run: npm ci -w core -w api -w mcp

      # ── Build & type check backend (tsc -b resolves project references) ──
      - name: Build & check (API → core + MCP)
        run: npx tsc -b --force
        working-directory: api

      - name: TypeScript check (MCP)
        run: npx tsc --noEmit
        working-directory: mcp

      # ── Lint checks (backend) ──
      - name: Lint (Core)
        run: npx eslint .
        working-directory: core

      - name: Lint (API)
        run: npx eslint .
        working-directory: api

      - name: Lint (MCP)
        run: npx eslint .
        working-directory: mcp

      # ── Install web-ui dependencies (npm install: root lockfile has macOS-only rollup binaries) ──
      - name: Install dependencies (web-ui)
        run: npm install -w web-ui --no-package-lock --no-audit --no-fund

      # ── Web UI build & lint ──
      - name: TypeScript & build check (Web UI)
        run: npm run build
        working-directory: web-ui

      - name: Lint (Web UI)
        run: npx eslint .
        working-directory: web-ui

  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # ── Create .env.test for test-api container (Stripe test keys) ──
      - name: Create test env file
        run: |
          cat > tests/.env.test << 'EOF'
          STRIPE_SECRET_KEY=
          STRIPE_PRICE_ID_MONTHLY=
          STRIPE_PRICE_ID_ANNUAL=
          STRIPE_WEBHOOK_SECRET=whsec_test_learnforge_integration_tests
          EOF

      # ── Install test runner dependencies ──
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
        working-directory: tests

      # ── Run integration tests (vitest handles docker compose up/down) ──
      - name: Run integration tests
        run: npx vitest run --config vitest.config.ts
        working-directory: tests

      # ── Ensure containers are torn down even on failure ──
      - name: Cleanup test containers
        if: always()
        run: docker compose -f docker-compose.test.yml down --volumes --remove-orphans 2>/dev/null || true
        working-directory: tests

  # ---------------------------------------------------------------------------
  # NEW PATH -- publish to GHCR. Dormant: nothing here deploys.
  #
  # THIS IS A COPY OF flof-codes/.github's build-push.yml, REDUCED, AND THAT IS
  # A DELIBERATE EXCEPTION.
  #
  # Every other app calls the shared reusable workflow. LearnForge cannot:
  # GitHub does not permit a PUBLIC repository to consume a reusable workflow
  # from a PRIVATE one, and flof-codes/.github is private and staying private.
  # No setting bridges it -- the "Accessible from repositories owned by the
  # user" policy only widens sharing among private repos. The failure mode, if
  # anyone tries again, is a run marked completed with ZERO jobs, no logs and no
  # annotations, which reads as a malformed workflow file rather than as a
  # visibility problem. Two runs on 2026-07-30 confirmed it, including an
  # 8-line minimal caller with permissions declared.
  #
  # THE OBLIGATION THIS CREATES: a fix to build-push.yml -- a pinned action SHA,
  # the concurrency key, the provenance decision -- DOES NOT REACH THIS FILE.
  # Nothing warns and nothing fails; it keeps building with the old logic.
  # server-config's README records the same obligation from the other side.
  #
  # TWO images, not three. api/src/index.ts starts Fastify AND the MCP
  # StreamableHTTP server in one process, and no mcp/Dockerfile exists, so there
  # is no third image to build.
  #
  # STILL GATED ON `needs: [build, test]`, which is why this lives here rather
  # than in its own workflow file: a separate file cannot depend on jobs in this
  # one, so it would publish images from a run whose tests had failed. That
  # property has to stay true after the flip, when the deploy job replaces the
  # legacy one.
  #
  # No build-args. The web image's six configuration values are placeholder
  # tokens substituted at container start by web-ui/docker-entrypoint.sh, which
  # keeps one artifact usable in every environment and keeps the operator's
  # postal address out of both the repo and the image history.
  #
  # NO HOST, PORT OR USERNAME APPEARS IN THIS JOB, deliberately -- this repo is
  # public. The build half needs none; the deploy job added at the flip reads
  # DEPLOY_HOST, DEPLOY_PORT and DEPLOY_USER from secrets, which are not
  # publicly readable.
  # ---------------------------------------------------------------------------
  build-images:
    needs: [build, test]
    runs-on: ubuntu-24.04

    # ONE JOB DEFINITION FOR BOTH IMAGES. Two near-identical jobs in one file is
    # the same drift this whole design exists to prevent, one scope smaller.
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: learnforge-api
            dockerfile: api/Dockerfile
          - image: learnforge-web
            dockerfile: web-ui/Dockerfile

    # ONE BUILD PER REF PER IMAGE, and this MUST be job-level, for two
    # independent reasons.
    #
    # The `matrix` context does not exist at workflow level -- it is available
    # in jobs.<job_id>.concurrency only. Written at the top of the file,
    # ${{ matrix.image }} expands to the empty string, both images land in one
    # group, and with cancel-in-progress each cancels the other: the run ends
    # with one image at the new commit and one still at the old. No parse error,
    # no warning.
    #
    # And workflow-level concurrency would cover EVERY job including the deploy
    # job added at the flip, which must never be cancellable. That was DRIFT #38
    # in the shared workflow; do not re-introduce it here.
    concurrency:
      group: build-images-${{ github.ref }}-${{ matrix.image }}
      cancel-in-progress: true

    # The default GITHUB_TOKEN is read-only on contents and has NO package
    # scope. Both are named explicitly rather than inherited, so this is
    # reviewable here instead of in a repository setting nobody looks at.
    permissions:
      contents: read
      packages: write

    steps:
      # Third-party actions are pinned BY COMMIT SHA, never by tag. A tag is
      # mutable, and a moved tag runs unreviewed code in a job holding
      # packages:write. The trailing comment is the readable version.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      # :latest MOVES ONLY ON THE DEFAULT BRANCH -- that is what `enable` does,
      # and it is a safety property rather than tidiness. The host pulls :latest.
      # Without it, pushing a feature branch would silently make that branch what
      # production deploys next. Every build still gets an immutable :<full-sha>,
      # so a branch build is deployable on purpose -- by naming its SHA -- but
      # never by accident.
      #
      # The image names are lowercase literals in the matrix above. build-push.yml
      # lowercases defensively because it derives the name from the repository,
      # and `LearnForge` would otherwise reach the registry with capitals, which
      # it rejects. Here they are written out, so there is nothing to lowercase.

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          # Context is the REPO ROOT for both images: api/Dockerfile copies
          # core/, mcp/ and api/, and web-ui/Dockerfile copies the root
          # package.json alongside web-ui/. Neither builds from its own
          # subdirectory.
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # provenance/sbom off DELIBERATELY. With them on, buildx pushes an
          # image INDEX (the image plus attestation manifests) rather than a
          # plain manifest. Everything still runs, but the phase 1a digest
          # comparison then measures an index digest against a manifest digest
          # and reports a mismatch that is not one. Revisit once digest
          # comparison is settled; note it in DRIFT.md if it is turned on.
          provenance: false
          sbom: false

      - name: Report
        # A LOCALLY built digest is not the same artifact -- CI will not
        # reproduce it, because metadata-action stamps the commit into the config
        # and the created timestamp moves on every rebuild. Only "same run" is a
        # valid basis for comparison, so the run page carries both.
        run: |
          set -euo pipefail
          {
            echo "## ${{ matrix.image }}"
            echo
            echo '```'
            echo "image:  ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}"
            echo "digest: ${{ steps.build.outputs.digest }}"
            echo "run:    ${{ github.run_id }}"
            echo "commit: ${{ github.sha }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # LEGACY PATH -- still the one that updates the live site. Delete in the flip
  # commit, together with docker-compose.prod.yml.
  # ---------------------------------------------------------------------------
  deploy:
    needs: [build, test]
    # Guarded on main because the trigger above now also matches phase1a/**
    # branches. Without this, verifying the image build on a branch would deploy
    # that branch to production.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add server to known_hosts
        run: ssh-keyscan -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          ssh -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} '
            cd /opt/learnforge &&
            sudo ./scripts/backup.sh &&
            GIT_SSH_COMMAND="ssh -i /home/github_deploy/.ssh/github_learnforge_access -o StrictHostKeyChecking=no" git pull origin main &&
            sudo docker compose -f docker-compose.prod.yml down --remove-orphans &&
            sudo docker compose -f docker-compose.prod.yml up --build -d
          '
