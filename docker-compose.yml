services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: learnforge
      POSTGRES_PASSWORD: learnforge
      POSTGRES_DB: learnforge
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnforge"]
      interval: 5s
      timeout: 3s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@learnforge.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_LISTEN_PORT: 5050
    ports:
      - "5050:5050"
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "3333:3000"
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://learnforge:learnforge@db:5432/learnforge
      PORT: "3000"
      IMAGE_PATH: /data/images
      JWT_SECRET: "${JWT_SECRET:-change-me-in-production}"
      JWT_EXPIRES_IN: "7d"
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"
      STRIPE_PRICE_ID_MONTHLY: "${STRIPE_PRICE_ID_MONTHLY:-}"
      STRIPE_PRICE_ID_ANNUAL: "${STRIPE_PRICE_ID_ANNUAL:-}"
      APP_URL: "${APP_URL:-http://localhost:5173}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_SECURE: "${SMTP_SECURE:-false}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM: "${SMTP_FROM:-LearnForge <office@learnforge.eu>}"
      MCP_PORT: "3001"
      MCP_PUBLIC_URL: "http://localhost:3001/mcp"
    volumes:
      - ./data/images:/data/images
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web-ui/Dockerfile
    # Moved from build ARGS to RUNTIME environment: web-ui/Dockerfile bakes in
    # placeholder tokens and web-ui/docker-entrypoint.sh substitutes these at
    # container start. Dev defaults are fine here — unlike the production file,
    # nothing legally binding is served from localhost.
    environment:
      VITE_API_URL: http://localhost:3333
      VITE_DONATION_URL: "${VITE_DONATION_URL:-}"
      OPERATOR_NAME: "${OPERATOR_NAME:-LearnForge}"
      OPERATOR_ADDRESS: "${OPERATOR_ADDRESS:-}"
      OPERATOR_CITY: "${OPERATOR_CITY:-Austria}"
      OPERATOR_EMAIL: "${OPERATOR_EMAIL:-office@learnforge.eu}"
    ports:
      # 8080: nginx-unprivileged runs as uid 101 and cannot bind a privileged port.
      - "5173:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg_data:
    name: learnforge_pg_data
